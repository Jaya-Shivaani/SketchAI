services:
  - type: web
    name: sketchai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: drawing_game_db
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.6"

