<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SketchAI - Game Room</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=2.0">
  <link rel="stylesheet" href="/static/css/game.css?v=3.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Game Navbar -->
  <header class="navbar" style="padding:0.75rem 1.5rem;">
    <div style="display:flex; align-items:center; gap:1.25rem;">
      <a href="/" class="brand">
        <span class="brand-icon">🎨</span>
        <span>SketchAI</span>
      </a>
      <div class="badge-code">
        ROOM: <span id="room-code-badge">------</span>
      </div>
    </div>
    
    <div style="display:flex; align-items:center; gap:0.85rem;">
      <!-- Sound FX Toggle Button -->
      <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Game Sound Effects">
        <span id="sound-icon">🔊</span>
        <span id="sound-text">Sound</span>
      </button>

      <!-- Theme Toggle Button -->
      <button class="theme-toggle-btn" title="Toggle Light / Dark Mode">
        <span class="theme-toggle-icon">🌙</span>
        <span class="theme-toggle-text">Dark</span>
      </button>
      <button id="start-game-btn" onclick="window.startGameNow()" class="btn btn-primary" style="display:none;">
        ▶ Start Game
      </button>
      <a href="/" class="btn btn-secondary">
        Exit Room
      </a>
    </div>
  </header>

  <!-- Main Game Layout -->
  <main class="game-layout">

    <!-- Left Sidebar: Players & Scoreboard -->
    <aside class="game-sidebar">
      <div class="sidebar-header">
        <span>Players</span>
        <span id="player-count">0</span>
      </div>
      <ul id="players-list" class="players-list">
        <!-- Dynamic Player Items -->
      </ul>
    </aside>

    <!-- Center Stage: Canvas, Toolbar, AI Badge, Timer -->
    <section class="game-center">

      <!-- Top Match Bar: Round & Synchronized Countdown Timer -->
      <div class="game-topbar">
        <div class="room-meta">
          <span id="round-indicator" class="round-indicator">Waiting for players...</span>
        </div>
        <div class="timer-container">
          <div id="timer-circle" class="timer-circle">--</div>
        </div>
      </div>

      <!-- Secret Word & GenAI Prompt Banner -->
      <div class="prompt-banner">
        <div class="word-display">
          <span class="word-label">Target:</span>
          <span id="word-value" class="word-value">WAITING...</span>
        </div>
        <div id="prompt-details" class="prompt-details">
          Ready to draw and guess!
        </div>
      </div>

      <!-- Live AI Category Prediction Badge -->
      <div class="ai-prediction-bar">
        <div class="ai-badge">
          <span class="ai-icon">🤖</span>
          <span>AI Category Prediction:</span>
          <span id="ai-category-pill" class="ai-cat-pill">Waiting for strokes...</span>
        </div>
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <div class="ai-confidence-bar">
            <div id="ai-confidence-fill" class="ai-confidence-fill"></div>
          </div>
          <span id="ai-confidence-text" style="font-size:0.85rem; font-weight:700; color:#38bdf8; min-width:35px;">0%</span>
        </div>
      </div>

      <!-- Canvas Area -->
      <div class="canvas-wrapper">
        <canvas id="drawing-canvas"></canvas>
        <div id="floating-emoji-container" class="floating-emoji-container"></div>
      </div>

      <!-- Drawing Toolbar -->
      <div id="drawing-toolbar" class="drawing-toolbar">
        <!-- Tool Selection -->
        <div class="tool-group">
          <button id="tool-brush" class="tool-btn active" title="Brush">
            <span class="tool-icon">✏️</span>
            <span class="tool-label">Brush</span>
          </button>
          <button id="tool-eraser" class="tool-btn tool-eraser" title="Eraser">
            <span class="tool-icon">🧹</span>
            <span class="tool-label">Eraser</span>
          </button>
          <button id="tool-undo" class="tool-btn" title="Undo Last Stroke">
            <span class="tool-icon">↩️</span>
            <span class="tool-label">Undo</span>
          </button>
          <button id="tool-clear" class="tool-btn tool-clear-btn" title="Clear Canvas">
            <span class="tool-icon">🗑️</span>
            <span class="tool-label">Clear</span>
          </button>
        </div>

        <!-- Comprehensive Color Palette (24 Vibrant Colors + Custom Picker) -->
        <div class="color-palette" title="Select drawing color">
          <!-- Monochromes -->
          <div class="color-swatch active" style="background:#000000;" data-color="#000000" title="Black"></div>
          <div class="color-swatch" style="background:#334155;" data-color="#334155" title="Dark Slate"></div>
          <div class="color-swatch" style="background:#64748b;" data-color="#64748b" title="Slate Gray"></div>
          <div class="color-swatch" style="background:#cbd5e1;" data-color="#cbd5e1" title="Silver"></div>
          <div class="color-swatch" style="background:#ffffff; border:1px solid #94a3b8;" data-color="#ffffff" title="White"></div>
          <!-- Warm Tones -->
          <div class="color-swatch" style="background:#ef4444;" data-color="#ef4444" title="Red"></div>
          <div class="color-swatch" style="background:#b91c1c;" data-color="#b91c1c" title="Dark Red"></div>
          <div class="color-swatch" style="background:#f43f5e;" data-color="#f43f5e" title="Rose"></div>
          <div class="color-swatch" style="background:#f97316;" data-color="#f97316" title="Bright Orange"></div>
          <div class="color-swatch" style="background:#f59e0b;" data-color="#f59e0b" title="Amber"></div>
          <div class="color-swatch" style="background:#eab308;" data-color="#eab308" title="Sun Yellow"></div>
          <div class="color-swatch" style="background:#facc15;" data-color="#facc15" title="Lemon"></div>
          <!-- Green & Teal -->
          <div class="color-swatch" style="background:#84cc16;" data-color="#84cc16" title="Lime"></div>
          <div class="color-swatch" style="background:#10b981;" data-color="#10b981" title="Emerald Green"></div>
          <div class="color-swatch" style="background:#047857;" data-color="#047857" title="Forest Green"></div>
          <div class="color-swatch" style="background:#14b8a6;" data-color="#14b8a6" title="Teal"></div>
          <div class="color-swatch" style="background:#06b6d4;" data-color="#06b6d4" title="Cyan"></div>
          <!-- Blue & Purple -->
          <div class="color-swatch" style="background:#0ea5e9;" data-color="#0ea5e9" title="Sky Blue"></div>
          <div class="color-swatch" style="background:#2563eb;" data-color="#2563eb" title="Royal Blue"></div>
          <div class="color-swatch" style="background:#1e3a8a;" data-color="#1e3a8a" title="Deep Navy"></div>
          <div class="color-swatch" style="background:#8b5cf6;" data-color="#8b5cf6" title="Violet"></div>
          <div class="color-swatch" style="background:#d946ef;" data-color="#d946ef" title="Fuchsia"></div>
          <div class="color-swatch" style="background:#ec4899;" data-color="#ec4899" title="Hot Pink"></div>
          <!-- Earth -->
          <div class="color-swatch" style="background:#78350f;" data-color="#78350f" title="Warm Brown"></div>
          <div class="color-swatch" style="background:#d97706;" data-color="#d97706" title="Ochre"></div>
          <!-- Custom Color Picker -->
          <input type="color" id="custom-color-picker" value="#000000" style="width:24px; height:24px; border:none; border-radius:50%; background:transparent; cursor:pointer;" title="Choose Any Custom Color">
        </div>

        <!-- Size & Active Tool Indicator -->
        <div class="tool-group brush-size-group">
          <label for="brush-size" style="font-size:0.8rem; font-weight:600; color:var(--text-muted);">Size:</label>
          <input type="range" id="brush-size" class="brush-size-slider" min="2" max="40" value="4">
          <span id="size-value" style="font-size:0.8rem; font-weight:700; min-width:32px;">4px</span>
          <span id="active-tool-badge" class="tool-badge">✏️ Brush</span>
        </div>
      </div>

    </section>

    <!-- Right Panel: Live Chat & Guess Submission -->
    <aside class="game-chat-panel">
      <div class="chat-header">
        <span>Guesses & Chat</span>
      </div>

      <div id="chat-messages" class="chat-messages">
        <div class="chat-msg msg-system">
          Welcome to the game! Type your guesses here.
        </div>
      </div>

      <!-- Live Emoji Quick Reaction Bar -->
      <div class="emoji-reaction-bar" title="React live to the drawing!">
        <button class="emoji-btn" data-emoji="👏" title="Applause">👏</button>
        <button class="emoji-btn" data-emoji="🔥" title="Fire">🔥</button>
        <button class="emoji-btn" data-emoji="😂" title="Laugh">😂</button>
        <button class="emoji-btn" data-emoji="❤️" title="Love">❤️</button>
        <button class="emoji-btn" data-emoji="🤔" title="Thinking">🤔</button>
      </div>

      <form id="chat-form" class="chat-input-bar">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type your guess here..." autocomplete="off">
        <button type="submit" class="btn btn-primary" style="padding:0.6rem 1rem;">
          Guess
        </button>
      </form>
    </aside>

  </main>

  <script src="/static/js/api.js?v=3.0"></script>
  <script src="/static/js/effects.js?v=3.0"></script>
  <script src="/static/js/canvas.js?v=3.0"></script>
  <script src="/static/js/websocket.js?v=3.0"></script>
  <script src="/static/js/game.js?v=3.0"></script>
</body>
</html>
